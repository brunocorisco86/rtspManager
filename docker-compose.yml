services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: rtsp_go2rtc
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/go2rtc.yaml:/config/go2rtc.yaml:ro
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.50'
