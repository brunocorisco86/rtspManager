# ==============================================================================
# go2rtc Configuration - 10_RTSP_Manager (Otimizado: Somente NVR)
# ==============================================================================

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  candidates:
    - 192.168.1.99:8555
    - 100.88.42.19:8555
    - stun:stun.l.google.com:19302

# Somente os canais do NVR com modo passivo (on-demand), transporte TCP e timeout de 3s
streams:
  canal_01:
    - rtsp://brunoconter:blurbang@192.168.1.20:554/user=brunoconter&password=blurbang&channel=1&stream=0.sdp#transport=tcp
  canal_03:
    - rtsp://brunoconter:blurbang@192.168.1.20:554/user=brunoconter&password=blurbang&channel=3&stream=0.sdp#transport=tcp
  canal_04:
    - rtsp://brunoconter:blurbang@192.168.1.20:554/user=brunoconter&password=blurbang&channel=4&stream=0.sdp#transport=tcp
  canal_06:
    - rtsp://brunoconter:blurbang@192.168.1.20:554/user=brunoconter&password=blurbang&channel=6&stream=0.sdp#transport=tcp

log:
  level: info
