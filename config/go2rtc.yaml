# ==============================================================================
# go2rtc Configuration - 10_RTSP_Manager
# ==============================================================================
# Otimizado para Raspberry Pi 3 (Zero Transcoding / Modo Passthrough)
# Consumo esperado de RAM: ~25 MB / CPU: < 1%
# ==============================================================================

api:
  listen: ":1984"
  # Interface web em http://192.168.1.99:1984

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

# Declaração dos streams das Câmeras e do NVR
# Formato padrão XM: rtsp://user:pass@IP:554/user=user&password=pass&channel=1&stream=0.sdp
streams:
  # --- Canais Diretos via NVR (192.168.1.20) ---
  nvr_canal1:
    - rtsp://admin:@192.168.1.20:554/user=admin&password=&channel=1&stream=0.sdp#backchannel=0
  nvr_canal2:
    - rtsp://admin:@192.168.1.20:554/user=admin&password=&channel=2&stream=0.sdp#backchannel=0
  nvr_canal3:
    - rtsp://admin:@192.168.1.20:554/user=admin&password=&channel=3&stream=0.sdp#backchannel=0
  nvr_canal4:
    - rtsp://admin:@192.168.1.20:554/user=admin&password=&channel=4&stream=0.sdp#backchannel=0
  nvr_canal5:
    - rtsp://admin:@192.168.1.20:554/user=admin&password=&channel=5&stream=0.sdp#backchannel=0
  nvr_canal6:
    - rtsp://admin:@192.168.1.20:554/user=admin&password=&channel=6&stream=0.sdp#backchannel=0

  # --- Acesso Direto às Câmeras Individuais (IP Direto) ---
  cam_04:
    - rtsp://admin:@192.168.1.4:554/user=admin&password=&channel=1&stream=0.sdp
  cam_05:
    - rtsp://admin:@192.168.1.5:554/user=admin&password=&channel=1&stream=0.sdp
  cam_06:
    - rtsp://admin:@192.168.1.6:554/user=admin&password=&channel=1&stream=0.sdp
  cam_10:
    - rtsp://admin:@192.168.1.10:554/user=admin&password=&channel=1&stream=0.sdp
  cam_11:
    - rtsp://admin:@192.168.1.11:554/user=admin&password=&channel=1&stream=0.sdp
  cam_31:
    - rtsp://admin:@192.168.1.31:554/user=admin&password=&channel=1&stream=0.sdp

log:
  level: info
