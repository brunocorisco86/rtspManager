# ==============================================================================
# go2rtc Configuration - 10_RTSP_Manager (Compatibilidade Universal H.264 / H.265)
# ==============================================================================

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  candidates:
    - 192.168.1.99:8555
    - 100.88.42.19:8555
    - stun:stun.l.google.com:19302

streams:
  canal_01:
    - rtsp://brunoconter:blurbang@192.168.1.20:554/user=brunoconter&password=blurbang&channel=1&stream=0.sdp#transport=tcp
  canal_03:
    - rtsp://brunoconter:blurbang@192.168.1.20:554/user=brunoconter&password=blurbang&channel=3&stream=0.sdp#transport=tcp
  canal_04:
    - rtsp://brunoconter:blurbang@192.168.1.20:554/user=brunoconter&password=blurbang&channel=4&stream=0.sdp#transport=tcp
  canal_06:
    - rtsp://brunoconter:blurbang@192.168.1.20:554/user=brunoconter&password=blurbang&channel=6&stream=0.sdp#transport=tcp

  # Versões H.264 convertidas sob demanda via ffmpeg no Raspberry Pi para navegadores sem H.265 nativo
  canal_03_h264:
    - ffmpeg:canal_03#video=h264#hardware=auto
  canal_04_h264:
    - ffmpeg:canal_04#video=h264#hardware=auto
  canal_06_h264:
    - ffmpeg:canal_06#video=h264#hardware=auto

log:
  level: info
